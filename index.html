<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FMC Gusau Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a7e2a;height:100vh;display:flex;flex-direction:column}
.header{background:#065a1d;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0a7e2a;font-weight:900;border:3px solid #FFCC00}
.container{max-width:700px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;overflow:hidden;background:#e5ddd5}
#chatBox{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;padding:10px 12px;border-radius:14px;font-size:14px;word-break:break-word;white-space:pre-wrap;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.2)}
.msg.me{align-self:flex-end;background:#dcf8c6}
.msg.other{align-self:flex-start;background:#fff}
.msg-head{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.msg-avatar{width:26px;height:26px;background:#0a7e2a;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
.msg-name{font-size:11px;font-weight:900;color:#0a7e2a}.msg-meta{font-size:9px;color:#888}
.msg-text{margin-left:32px;font-size:13px;white-space:pre-wrap}
.input-area{background:#f0f0f0;padding:8px;display:flex;gap:6px;align-items:flex-end}
.input-area textarea{flex:1;padding:11px 16px;border:none;border-radius:20px;outline:none;resize:none;max-height:100px;min-height:44px;font-size:14px}
.icon-btn{width:40px;height:40px;background:#fff;border:none;border-radius:50%;cursor:pointer;flex-shrink:0}
.btn-send{width:44px;height:44px;background:#0a7e2a;color:#fff;border:none;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0}
#loginScreen{position:fixed;inset:0;background:#0a7e2a;z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;width:100%;max-width:380px;border-radius:24px;padding:24px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#settingsPanel{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:none;align-items:flex-end;justify-content:center}
.settings-box{background:#fff;width:100%;max-width:700px;border-radius:20px 20px 0 0;padding:20px}
.recording{background:#ff3b30!important;color:#fff!important}
#errorMsg{background:#ff3b30;color:#fff;padding:8px;border-radius:8px;font-size:11px;margin-bottom:8px;display:none}
</style>
</head>
<body>

<div id="loginScreen">
<div class="login-box">
<div style="width:70px;height:70px;background:#fff;border:4px solid #FFCC00;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0a7e2a;font-weight:900;font-size:24px;margin:0 auto 10px">FMC</div>
<h2 style="color:#0a7e2a">FMC Gusau Chat</h2>
<p style="font-size:11px;color:#666;margin-bottom:10px">Fast • Permanent • English</p>
<div id="errorMsg"></div>
<input id="userName" placeholder="Your Name (e.g. Mudassir Hassan)*" value="Mudassir hassan" style="width:100%;padding:11px;border:2px solid #e5e7eb;border-radius:10px;margin:6px 0">
<input id="userDept" placeholder="Department (e.g. Lab)*" value="Lab" style="width:100%;padding:11px;border:2px solid #e5e7eb;border-radius:10px;margin:6px 0">
<button id="joinBtn" style="width:100%;padding:13px;background:#0a7e2a;color:#fff;border:none;border-radius:10px;font-weight:900;margin-top:8px;cursor:pointer">JOIN CHAT</button>
<small style="color:#888;font-size:9px;display:block;margin-top:8px">If JOIN fails, upload to Firebase Hosting</small>
</div>
</div>

<div class="header">
<div class="logo">FMC</div>
<div style="flex:1"><b>FMC Gusau</b><br><small id="myNameDisplay">-</small></div>
<button id="settingsBtn" style="background:rgba(255,255,255,.2);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer">⚙️</button>
</div>

<div class="container">
<div id="chatBox"><div style="text-align:center;color:#888;padding:20px;font-size:12px">Welcome! Type a message below 👇<br><br>ENTER = new line<br>SEND button = send</div></div>
<div class="input-area">
<button class="icon-btn" id="imgBtn">🖼️</button>
<input type="file" id="imgInput" accept="image/*" style="display:none">
<button class="icon-btn" id="voiceBtn">🎤</button>
<textarea id="msgInput" placeholder="Type message...
ENTER for new line
Press ➤ to send" rows="1"></textarea>
<button class="icon-btn btn-send" id="sendBtn">➤</button>
</div>
</div>

<div id="settingsPanel">
<div class="settings-box">
<h3 style="color:#0a7e2a">Settings</h3>
<div id="setInfo" style="background:#f0f7f0;padding:10px;border-radius:10px;margin:10px 0;font-size:12px"></div>
<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee"><div><b>Change Name</b></div><button onclick="changeName()" style="padding:6px 12px;background:#0a7e2a;color:#fff;border:none;border-radius:6px">Edit</button></div>
<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee"><div><b>Logout</b></div><button onclick="logout()" style="padding:6px 12px;background:#c00;color:#fff;border:none;border-radius:6px">Logout</button></div>
<div style="display:flex;justify-content:space-between;padding:12px 0"><div><b>Admin Delete All</b></div><button onclick="clearAll()" style="padding:6px 12px;background:#000;color:#fff;border:none;border-radius:6px">Delete</button></div>
<button onclick="document.getElementById('settingsPanel').style.display='none'" style="width:100%;padding:12px;background:#0a7e2a;color:#fff;border:none;border-radius:10px;margin-top:12px;font-weight:900">Close</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJ6iVZ3uCdxtEPO9leU6nX-pURug1wVNw",
  authDomain: "fmc-gusau.firebaseapp.com",
  projectId: "fmc-gusau",
  storageBucket: "fmc-gusau.firebasestorage.app",
  messagingSenderId: "911652359330",
  appId: "1:911652359330:web:506ec4fdb1accc00e75bfb"
};

let db, chatCol;
try{
 const app = initializeApp(firebaseConfig);
 db = getFirestore(app);
 chatCol = collection(db, "messages");
}catch(e){ console.log("Firebase init error", e); }

let currentUser = JSON.parse(localStorage.getItem('fmc_final_user')||'null');
const loginScreen = document.getElementById('loginScreen');
const chatBox = document.getElementById('chatBox');
const msgInput = document.getElementById('msgInput');
const errorMsg = document.getElementById('errorMsg');

function showError(t){
 errorMsg.style.display='block';
 errorMsg.innerText=t;
}

if(currentUser){
 loginScreen.style.display='none';
 document.getElementById('myNameDisplay').innerText = currentUser.name + ' ('+currentUser.dept+')';
 document.getElementById('setInfo').innerHTML = `<b>${currentUser.name}</b> (${currentUser.dept})`;
}

document.getElementById('joinBtn').onclick = ()=>{
 let name=document.getElementById('userName').value.trim();
 let dept=document.getElementById('userDept').value.trim();
 if(!name||!dept){showError('Please enter name and department!');return;}
 
 // SAVE FIRST - THEN HIDE - ALWAYS WORKS
 currentUser={name,dept,joined:new Date().toISOString()};
 localStorage.setItem('fmc_final_user',JSON.stringify(currentUser));
 loginScreen.style.display='none';
 document.getElementById('myNameDisplay').innerText = name+' ('+dept+')';
 document.getElementById('setInfo').innerHTML = `<b>${name}</b> (${dept})`;
 
 // Try to send join message, but don't block if fails
 if(chatCol){
  addDoc(chatCol,{name:"System",text:`${name} (${dept}) joined`,time:new Date().toLocaleTimeString(),createdAt:serverTimestamp(),system:true}).catch(e=>{
   console.log("Join msg failed (normal if file://)", e.message);
  });
 }
};

msgInput.addEventListener('input', ()=>{
 msgInput.style.height='auto';
 msgInput.style.height=Math.min(msgInput.scrollHeight,100)+'px';
});

document.getElementById('sendBtn').onclick = sendMsg;

async function sendMsg(){
 let text=msgInput.value.trim();
 if(!text||!currentUser)return;
 msgInput.value='';
 msgInput.style.height='44px';
 if(!chatCol){ showLocalMessage(currentUser.name, currentUser.dept, text); return; }
 try{
  await addDoc(chatCol,{name:currentUser.name,dept:currentUser.dept,text:text,type:"text",time:new Date().toLocaleTimeString(),createdAt:serverTimestamp()});
 }catch(e){
  showError('Firebase Error: '+e.message+' - Upload to hosting! Showing locally only.');
  showLocalMessage(currentUser.name, currentUser.dept, text);
 }
}

function showLocalMessage(name, dept, text){
 let html = `<div class="msg-head"><div class="msg-avatar">${name.charAt(0).toUpperCase()}</div><div><div class="msg-name">${name} (${dept})</div><div class="msg-meta">${new Date().toLocaleTimeString()} • Local</div></div></div>`;
 html += `<div class="msg-text">${text}</div>`;
 let div = document.createElement('div');
 div.className='msg me';
 div.innerHTML=html;
 chatBox.appendChild(div);
 chatBox.scrollTop = chatBox.scrollHeight;
}

// IMAGE
function compressImage(file, callback){
 const reader = new FileReader();
 reader.onload = e=>{
  const img = new Image();
  img.onload = ()=>{
   const canvas = document.createElement('canvas');
   let w=img.width, h=img.height;
   if(w>600){ h=h*(600/w); w=600; }
   canvas.width=w; canvas.height=h;
   canvas.getContext('2d').drawImage(img,0,0,w,h);
   callback(canvas.toDataURL('image/jpeg',0.6));
  };
  img.src=e.target.result;
 };
 reader.readAsDataURL(file);
}
document.getElementById('imgBtn').onclick = ()=>document.getElementById('imgInput').click();
document.getElementById('imgInput').onchange = e=>{
 let file=e.target.files[0]; if(!file)return;
 compressImage(file, async (compressed)=>{
  try{ await addDoc(chatCol,{name:currentUser.name,dept:currentUser.dept,text:"Photo",imageUrl:compressed,type:"image",time:new Date().toLocaleTimeString(),createdAt:serverTimestamp()}); }catch(err){showLocalMessage(currentUser.name,currentUser.dept,"[Photo] "+compressed.substring(0,20)+"...")}
 });
 e.target.value='';
};

// VOICE
let mediaRecorder=null, audioChunks=[], isRecording=false;
document.getElementById('voiceBtn').onclick = async()=>{
 let btn=document.getElementById('voiceBtn');
 if(!isRecording){
  try{
   let stream=await navigator.mediaDevices.getUserMedia({audio:true});
   mediaRecorder=new MediaRecorder(stream);
   audioChunks=[];
   mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
   mediaRecorder.onstop=async()=>{
    let blob=new Blob(audioChunks,{type:'audio/webm'});
    btn.classList.remove('recording'); btn.innerText='🎤';
    let reader=new FileReader();
    reader.onload=async(ev=>{
     try{ await addDoc(chatCol,{name:currentUser.name,dept:currentUser.dept,text:"Voice",audioUrl:ev.target.result,type:"voice",time:new Date().toLocaleTimeString(),createdAt:serverTimestamp()}); }catch(err){}
    });
    reader.readAsDataURL(blob);
   };
   mediaRecorder.start(); isRecording=true;
   btn.classList.add('recording'); btn.innerText='⏹️';
  }catch(err){alert('Mic permission needed')}
 }else{ mediaRecorder.stop(); isRecording=false; }
};

document.getElementById('settingsBtn').onclick = ()=>{ document.getElementById('settingsPanel').style.display='flex'; };
document.getElementById('settingsPanel').onclick = e=>{ if(e.target.id==='settingsPanel') e.currentTarget.style.display='none'; };
window.changeName = ()=>{
 let n=prompt('New Name:', currentUser.name); if(!n)return;
 let d=prompt('New Department:', currentUser.dept); if(!d)return;
 currentUser.name=n.trim(); currentUser.dept=d.trim();
 localStorage.setItem('fmc_final_user',JSON.stringify(currentUser));
 document.getElementById('myNameDisplay').innerText = currentUser.name+' ('+currentUser.dept+')';
};
window.logout = ()=>{ if(confirm('Logout?')){ localStorage.removeItem('fmc_final_user'); location.reload(); } };
window.clearAll = async()=>{
 let pin=prompt('Admin PIN (1234):'); if(pin!='1234'){alert('Wrong PIN');return;}
 if(!db)return;
 const snap = await getDocs(chatCol);
 for(const d of snap.docs){await deleteDoc(doc(db,"messages",d.id));}
};

if(chatCol){
 const q = query(chatCol, orderBy("createdAt","desc"), limit(40));
 onSnapshot(q, (snapshot)=>{
  let docs = [];
  snapshot.forEach(d=>docs.push(d.data()));
  docs.reverse();
  chatBox.innerHTML='';
  docs.forEach(m=>{
   if(!m.name) return;
   let isMe = currentUser && m.name==currentUser.name &&!m.system;
   if(m.system){
    chatBox.innerHTML+=`<div style="align-self:center;background:#fff8c6;padding:6px 12px;border-radius:20px;font-size:10px;color:#665;margin:4px 0">${m.text}</div>`;
   }else{
    let html = `<div class="msg-head"><div class="msg-avatar">${m.name.charAt(0).toUpperCase()}</div><div><div class="msg-name">${m.name} (${m.dept||'FMC'})</div><div class="msg-meta">${m.time||''}</div></div></div>`;
    html += `<div class="msg-text">${m.text}</div>`;
    if(m.type=='image' && m.imageUrl) html+=`<img src="${m.imageUrl}" style="max-width:180px;border-radius:8px;margin-top:5px;margin-left:32px" loading="lazy" />`;
    if(m.type=='voice' && m.audioUrl) html+=`<audio controls src="${m.audioUrl}" style="width:200px;margin-left:32px;margin-top:5px"></audio>`;
    chatBox.innerHTML+=`<div class="msg ${isMe?'me':'other'}">${html}</div>`;
   }
  });
  chatBox.scrollTop = chatBox.scrollHeight;
 }, (error)=>{
  showError("Firebase connection failed: "+error.message+" - Open via https, not file://");
 });
}else{
 chatBox.innerHTML='<div style="text-align:center;padding:20px;color:#c00">Firebase not loaded because you opened file://<br>Please host it on Firebase Hosting or GitHub Pages</div>';
}
</script>
</body>
</html>
