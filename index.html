<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FMC Gusau Super Chat - Video Supported</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23FFCC00'/%3E%3Ccircle cx='50' cy='50' r='36' fill='%23167a32'/%3E%3Crect x='42' y='28' width='16' height='44' fill='white'/%3E%3Crect x='28' y='42' width='44' height='16' fill='white'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#11823a;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.header{background:linear-gradient(135deg,#0a7e2a,#065a1d);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{width:44px;height:44px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #FFCC00;overflow:hidden;cursor:pointer;user-select:none;flex-shrink:0}
.logo svg{width:100%;height:100%}
.container{max-width:700px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;overflow:hidden;background:#e5ddd5}
#chatBox{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 14px;border-radius:16px;font-size:14px;word-break:break-word;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.2);position:relative}
.msg.me{align-self:flex-end;background:#dcf8c6}
.msg.other{align-self:flex-start;background:#fff}
.msg-del{position:absolute;top:4px;right:6px;background:#ff3b30;color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer;display:none}
.msg.can-delete.msg-del{display:flex;align-items:center;justify-content:center}
.msg video{max-width:240px;max-height:300px;border-radius:10px;margin-top:8px;margin-left:32px;background:#000;display:block}
.input-area{background:#f0f0f0;padding:8px 10px;display:flex;gap:6px;align-items:flex-end;flex-shrink:0}
.input-area textarea{flex:1;padding:12px 16px;border:none;border-radius:20px;font-size:14px;outline:none;resize:none;max-height:100px;min-height:44px}
.icon-btn{width:40px;height:40px;background:#fff;border:none;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-send{width:48px;height:48px;background:#0a7e2a;color:#fff;border:none;border-radius:50%;font-size:20px;cursor:pointer;flex-shrink:0}
/* FIXED LOGIN - BAYA WUCEWA */
#loginScreen{position:fixed;inset:0;background:#11823a;z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.login-box{background:#fff;width:100%;max-width:360px;border-radius:24px;padding:24px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.login-icon{width:90px;height:90px;margin:0 auto 12px;border-radius:50%;background:#FFCC00;padding:6px}
.login-icon-inner{width:100%;height:100%;background:#167a32;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:36px;font-weight:900}
#settingsPanel, #adminPanel{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}
.settings-box{background:#fff;width:100%;max-width:400px;border-radius:20px;padding:20px;max-height:85vh;overflow-y:auto}
.setting-item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #eee}
.recording{background:#ff3b30!important;color:#fff!important}
#uploadStatus{background:#0a7e2a;color:#fff;padding:6px 12px;font-size:11px;text-align:center;display:none;flex-shrink:0}
input, textarea{width:100%;padding:12px;border:2px solid #e5e7eb;border-radius:12px;margin:6px 0;outline:none}
input:focus{border-color:#0a7e2a}
</style>
</head>
<body>

<div id="loginScreen">
<div class="login-box">
<div class="login-icon"><div class="login-icon-inner">✚</div></div>
<h2 style="color:#167a32;font-weight:900;font-size:20px">FMC Gusau Super Chat</h2>
<p style="font-size:12px;color:#888;margin:4px 0 14px">Login once, stay permanently!</p>
<input id="userName" placeholder="Usman hassan">
<input id="userDept" placeholder="Ict">
<button id="joinBtn" style="width:100%;padding:14px;background:#167a32;color:#fff;border:none;border-radius:12px;font-weight:900;margin-top:10px;cursor:pointer">JOIN CHAT</button>
</div>
</div>

<div class="header">
<div class="logo" id="headerLogo" title="Tap 5 times for Admin">
<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#FFCC00"/><circle cx="50" cy="50" r="36" fill="#167a32"/><rect x="42" y="28" width="16" height="44" fill="white"/><rect x="28" y="42" width="44" height="16" fill="white"/></svg>
</div>
<div style="flex:1"><b>FMC Gusau Live</b><br><small id="myNameDisplay" style="color:#FFCC00">-</small> <small id="adminBadge" style="background:#FFCC00;color:#000;padding:2px 6px;border-radius:8px;font-size:9px;display:none">ADMIN</small></div>
<button id="settingsBtn" style="background:rgba(255,255,255,.2);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer">⚙️</button>
</div>

<div class="container">
<div id="chatBox"></div>
<div id="uploadStatus">Uploading video...</div>
<div class="input-area">
<button class="icon-btn" id="imgBtn">🖼️</button><input type="file" id="imgInput" accept="image/*" style="display:none">
<button class="icon-btn" id="videoBtn" style="background:#e3f2fd">🎬</button><input type="file" id="videoInput" accept="video/*" style="display:none">
<button class="icon-btn" id="voiceBtn">🎤</button>
<textarea id="msgInput" placeholder="Type message..."></textarea>
<button class="icon-btn btn-send" id="sendBtn">➤</button>
</div>
</div>

<div id="settingsPanel"><div class="settings-box">
<h3 style="color:#0a7e2a">Settings</h3>
<div id="setInfo" style="background:#f0f7f0;padding:12px;border-radius:12px;margin:12px 0;font-size:12px"></div>
<div class="setting-item"><div><b>Change Name</b></div><button onclick="changeName()" style="padding:8px 14px;background:#0a7e2a;color:#fff;border:none;border-radius:8px">Change</button></div>
<div class="setting-item"><div><b>Clear My View</b></div><button onclick="clearLocal()" style="padding:8px 14px;background:#eee;border:none;border-radius:8px">Clear</button></div>
<div class="setting-item"><div><b>Logout</b></div><button onclick="logout()" style="padding:8px 14px;background:#c00;color:#fff;border:none;border-radius:8px">Logout</button></div>
<div class="setting-item" id="adminMenu" style="display:none;background:#fff8e1;border-radius:8px;padding:10px"><div><b>👑 Admin Tools</b></div><button onclick="clearAll()" style="padding:8px 14px;background:#000;color:#FFCC00;border:none;border-radius:8px">Delete All</button></div>
<button onclick="document.getElementById('settingsPanel').style.display='none'" style="width:100%;padding:14px;background:#0a7e2a;color:#fff;border:none;border-radius:12px;margin-top:12px;font-weight:900">Close</button>
</div></div>

<div id="adminPanel"><div class="settings-box" style="border:3px solid #FFCC00">
<h3 style="color:#b77900">🔐 Hidden Admin Access</h3>
<input id="adminPin" type="password" placeholder="Enter Admin PIN *" style="margin-top:12px">
<button id="adminLoginBtn" style="width:100%;padding:12px;background:#000;color:#FFCC00;border:none;border-radius:10px;font-weight:900;margin-top:10px">UNLOCK ADMIN</button>
<button onclick="document.getElementById('adminPanel').style.display='none'" style="width:100%;padding:10px;background:#eee;border:none;border-radius:10px;margin-top:8px">Cancel</button>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyDJ6iVZ3uCdxtEPO9leU6nX-pURug1wVNw", authDomain: "fmc-gusau.firebaseapp.com", projectId: "fmc-gusau", storageBucket: "fmc-gusau.firebasestorage.app", messagingSenderId: "911652359330", appId: "1:911652359330:web:506ec4fdb1accc00e75bfb" };
const SECRET_ADMIN_PIN = "FMC2026";
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const chatCol = collection(db, "messages");
let currentUser = JSON.parse(localStorage.getItem('fmc_user_permanent_v3')||localStorage.getItem('fmc_final_user')||'null');
let isAdmin = localStorage.getItem('fmc_is_admin')==='yes';
const loginScreen = document.getElementById('loginScreen');
const chatBox = document.getElementById('chatBox');
const msgInput = document.getElementById('msgInput');
const uploadStatus = document.getElementById('uploadStatus');
function updateAdminUI(){
 document.getElementById('adminBadge').style.display = isAdmin? 'inline-block' : 'none';
 document.getElementById('adminMenu').style.display = isAdmin? 'flex' : 'none';
}
updateAdminUI();
if(currentUser){
 loginScreen.style.display='none';
 document.getElementById('myNameDisplay').innerText = currentUser.name + ' ('+currentUser.dept+')';
}
document.getElementById('joinBtn').onclick = ()=>{
 let name=document.getElementById('userName').value.trim();
 let dept=document.getElementById('userDept').value.trim();
 if(!name||!dept){alert('Saka suna da department');return;}
 currentUser={name,dept,joined:new Date().toISOString()};
 localStorage.setItem('fmc_user_permanent_v3',JSON.stringify(currentUser));
 localStorage.setItem('fmc_final_user',JSON.stringify(currentUser));
 loginScreen.style.display='none';
 document.getElementById('myNameDisplay').innerText = name+' ('+dept+')';
 addDoc(chatCol,{name:"System",text:`${name} (${dept}) joined`,time:new Date().toLocaleTimeString(),createdAt:serverTimestamp(),system:true}).catch(()=>{});
};
msgInput.addEventListener('input', ()=>{ msgInput.style.height='auto'; msgInput.style.height=Math.min(msgInput.scrollHeight,100)+'px'; });
document.getElementById('sendBtn').onclick = async ()=>{
 let text=msgInput.value.trim(); if(!text||!currentUser)return;
 msgInput.value=''; msgInput.style.height='44px';
 try{ await addDoc(chatCol,{name:currentUser.name,dept:currentUser.dept,text:text,type:"text",time:new Date().toLocaleTimeString(),createdAt:serverTimestamp()}); }catch(e){alert(e.message)}
};
let tapCount=0, tapTimer=null;
document.getElementById('headerLogo').onclick = ()=>{
 tapCount++; clearTimeout(tapTimer); tapTimer=setTimeout(()=>{tapCount=0}, 2000);
 if(tapCount>=5){tapCount=0; document.getElementById('adminPanel').style.display='flex';}
};
document.getElementById('adminLoginBtn').onclick = ()=>{
 let pin=document.getElementById('adminPin').value.trim();
 if(pin===SECRET_ADMIN_PIN){
  isAdmin=true; localStorage.setItem('fmc_is_admin','yes'); updateAdminUI();
  document.getElementById('adminPanel').style.display='none'; document.getElementById('adminPin').value='';
  alert('Admin unlocked!');
 }else{ alert('Wrong PIN!'); }
};
function compressImage(file, cb){
 const r=new FileReader(); r.onload=e=>{
  const img=new Image(); img.onload=()=>{
   const c=document.createElement('canvas'); let w=img.width,h=img.height; if(w>600){h=h*(600/w);w=600} c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); cb(c.toDataURL('image/jpeg',0.6));
  }; img.src=e.target.result;
 }; r.readAsDataURL(file);
}
document.getElementById('imgBtn').onclick=()=>document.getElementById('imgInput').click();
document.getElementById('imgInput').onchange=e=>{
 let f=e.target.files[0]; if(!f)return;
 compressImage(f, async comp=>{ try{await addDoc(chatCol,{name:currentUser.name,dept:currentUser.dept,text:"🖼️ Photo",imageUrl:comp,type:"image",time:new Date().toLocaleTimeString(),createdAt:serverTimestamp()})}catch(err){alert(err.message)}}); e.target.value='';
};
document.getElementById('videoBtn').onclick=()=>document.getElementById('videoInput').click();
document.getElementById('videoInput').onchange=e=>{
 let f=e.target.files[0]; if(!f)return;
 if(f.size>8*1024*1024){ alert('Video babba! Max 8MB'); return; }
 uploadStatus.style.display='block';
 let reader=new FileReader();
 reader.onload=async ev=>{
  try{ await addDoc(chatCol,{name:currentUser.name,dept:currentUser.dept,text:"🎬 Video",videoUrl:ev.target.result,type:"video",time:new Date().toLocaleTimeString(),createdAt:serverTimestamp()}); uploadStatus.style.display='none';
  }catch(err){ uploadStatus.style.display='none'; alert('Video fail: '+err.message); }
 };
 reader.readAsDataURL(f); e.target.value='';
};
let mr=null,ch=[],rec=false;
document.getElementById('voiceBtn').onclick=async()=>{
 let b=document.getElementById('voiceBtn');
 if(!rec){
  try{
   let s=await navigator.mediaDevices.getUserMedia({audio:true}); mr=new MediaRecorder(s); ch=[]; mr.ondataavailable=e=>ch.push(e.data);
   mr.onstop=async()=>{ let blob=new Blob(ch,{type:'audio/webm'}); b.classList.remove('recording'); b.innerText='🎤'; let r=new FileReader(); r.onload=async ev=>{ try{await addDoc(chatCol,{name:currentUser.name,dept:currentUser.dept,text:"🎤 Voice",audioUrl:ev.target.result,type:"voice",time:new Date().toLocaleTimeString(),createdAt:serverTimestamp()})}catch{}}; r.readAsDataURL(blob); };
   mr.start(); rec=true; b.classList.add('recording'); b.innerText='⏹️';
  }catch{alert('Mic error')}
 }else{mr.stop(); rec=false}
};
document.getElementById('settingsBtn').onclick=()=>{document.getElementById('setInfo').innerHTML=`<b>${currentUser?.name||'-'}</b> (${currentUser?.dept||'-'})<br>${isAdmin?'<span style="color:green">Admin Mode</span>':'User Mode - zaka iya goge naka'}`; document.getElementById('settingsPanel').style.display='flex'; updateAdminUI()};
document.getElementById('settingsPanel').onclick=e=>{if(e.target.id==='settingsPanel')e.currentTarget.style.display='none'};
document.getElementById('adminPanel').onclick=e=>{if(e.target.id==='adminPanel')e.currentTarget.style.display='none'};
window.changeName=()=>{let n=prompt('New Name:',currentUser.name); if(!n)return; let d=prompt('New Dept:',currentUser.dept); if(!d)return; currentUser.name=n.trim(); currentUser.dept=d.trim(); localStorage.setItem('fmc_user_permanent_v3',JSON.stringify(currentUser)); document.getElementById('myNameDisplay').innerText=currentUser.name+' ('+currentUser.dept+')'};
window.clearLocal=()=>{if(confirm('Clear local view?'))chatBox.innerHTML='<div style="text-align:center;color:#888;padding:20px">Cleared locally</div>'};
window.logout=()=>{if(confirm('Logout?')){localStorage.removeItem('fmc_user_permanent_v3'); localStorage.removeItem('fmc_final_user'); localStorage.removeItem('fmc_is_admin'); location.reload();}};
window.clearAll=async()=>{if(!isAdmin){alert('Admin only!');return;} if(!confirm('Delete ALL?'))return; const snap=await getDocs(chatCol); for(const d of snap.docs){await deleteDoc(doc(db,"messages",d.id));}};

// === SABON DELETE - KOWA ZAI IYA GOGE NASA ===
window.deleteMsg=async(id, ownerName)=>{
 if(!isAdmin && ownerName!== currentUser.name){ alert('Ba zaka iya goge na wani ba! Naka kadai zaka iya gogewa.'); return; }
 if(!confirm(ownerName===currentUser.name?'Goge naka message din?':'Goge wannan message din (Admin)?'))return;
 await deleteDoc(doc(db,"messages",id));
};

const q = query(chatCol, orderBy("createdAt","desc"), limit(80));
onSnapshot(q, snap=>{
 let docs=[]; snap.forEach(d=>{docs.push({id:d.id,...d.data()})}); docs.reverse();
 chatBox.innerHTML='';
 docs.forEach(m=>{
  if(!m.name)return;
  let isMe=currentUser && m.name==currentUser.name &&!m.system;
  let canDelete = isAdmin || isMe;
  if(m.system){chatBox.innerHTML+=`<div style="align-self:center;background:#fff8c6;padding:6px 12px;border-radius:20px;font-size:10px;color:#665;margin:4px 0">${m.text}</div>`; return;}
  let badge=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><div style="width:26px;height:26px;background:#0a7e2a;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px">${m.name.charAt(0).toUpperCase()}</div><div><div style="font-size:11px;font-weight:900;color:#0a7e2a">${m.name} (${m.dept||'FMC'})</div><div style="font-size:9px;color:#666">${m.time||''}</div></div></div>`;
  let content=`${badge}<div style="margin-left:32px">${m.text}</div>`;
  if(m.type=='image' && m.imageUrl) content+=`<img src="${m.imageUrl}" style="max-width:100%;border-radius:10px;margin-top:6px;margin-left:32px" loading="lazy" />`;
  if(m.type=='video' && m.videoUrl) content+=`<video src="${m.videoUrl}" controls playsinline style="max-width:240px"></video>`;
  if(m.type=='voice' && m.audioUrl) content+=`<audio controls src="${m.audioUrl}" style="width:200px;margin-left:32px;margin-top:5px"></audio>`;
  let delBtn = canDelete? `<button class="msg-del" onclick="deleteMsg('${m.id}','${m.name.replace(/'/g,"\\'")}')">🗑️</button>` : ``;
  chatBox.innerHTML+=`<div class="msg ${isMe?'me':'other'} ${canDelete?'can-delete':''}" style="padding:10px 12px">${content}${delBtn}</div>`;
 });
 chatBox.scrollTop=chatBox.scrollHeight;
});
</script>
</body>
</html>
