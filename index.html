<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FMC Gusau Super Chat - All Files</title>
<meta name="theme-color" content="#0a7e2a">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a7e2a;height:100vh;display:flex;flex-direction:column}
.header{background:linear-gradient(135deg,#0a7e2a,#065a1d);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.logo{width:44px;height:44px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0a7e2a;font-weight:900;font-size:20px;border:3px solid #FFCC00;cursor:pointer}
.container{max-width:750px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;overflow:hidden;background:#e5ddd5}
#chatBox{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 12px;border-radius:16px;font-size:14px;word-break:break-word;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.2);position:relative}
.msg.me{align-self:flex-end;background:#dcf8c6}
.msg.other{align-self:flex-start;background:#fff}
.msg-head{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.msg-avatar{width:26px;height:26px;background:#0a7e2a;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px}
.msg-name{font-size:11px;font-weight:900;color:#0a7e2a}.msg-meta{font-size:9px;color:#888}
.msg-text{margin-left:32px;font-size:13px;white-space:pre-wrap}
.msg video{max-width:240px;border-radius:10px;margin-top:6px;margin-left:32px;background:#000}
.msg audio{width:220px;margin-left:32px;margin-top:6px}
.msg.file-card{background:#f0f7f0;border:1px solid #c8e6c9;border-radius:10px;padding:10px;margin-top:6px;margin-left:32px;display:flex;align-items:center;gap:10px;max-width:260px}
.msg-del{position:absolute;top:4px;right:6px;background:#ff3b30;color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer;display:none}
.msg.admin.msg-del{display:flex;align-items:center;justify-content:center}
.input-area{background:#f0f0f0;padding:8px 10px;display:flex;gap:6px;align-items:flex-end}
.input-area textarea{flex:1;padding:12px 16px;border:none;border-radius:20px;font-size:14px;outline:none;resize:none;max-height:100px;min-height:44px}
.icon-btn{width:40px;height:40px;background:#fff;border:none;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 1px rgba(0,0,0,.1);flex-shrink:0}
.btn-send{width:50px;height:50px;background:#0a7e2a;color:#fff;border:none;border-radius:50%;font-size:22px;cursor:pointer;flex-shrink:0}
#loginScreen{position:fixed;inset:0;background:#0a7e2a;z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;width:100%;max-width:400px;border-radius:24px;padding:28px;text-align:center}
#settingsPanel, #adminPanel, #attachPanel{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:none;align-items:flex-end;justify-content:center}
.settings-box{background:#fff;width:100%;max-width:700px;border-radius:24px 24px 0 0;padding:20px;max-height:85vh;overflow-y:auto}
.setting-item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #eee}
.attach-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:10px 0}
.attach-item{background:#f5f5f5;border-radius:14px;padding:16px 6px;text-align:center;cursor:pointer;border:none}
.attach-item span{font-size:24px;display:block}.attach-item b{font-size:11px;display:block;margin-top:4px}
.progress{height:4px;background:#0a7e2a;width:0%;transition:.3s;border-radius:10px;margin-top:4px}
.recording{background:#ff3b30!important;color:#fff!important;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
</style>
</head>
<body>

<div id="loginScreen">
<div class="login-box">
<div class="logo" style="width:84px;height:84px;font-size:32px;margin:0 auto 12px;border:4px solid #FFCC00">FMC</div>
<h2 style="color:#0a7e2a">FMC Gusau Super Chat</h2>
<p style="font-size:11px;color:#666">Send Text, Image, Video, Files, Voice</p>
<input id="userName" placeholder="Your Full Name *" style="width:100%;padding:12px;border:2px solid #e5e7eb;border-radius:10px;margin:6px 0">
<input id="userDept" placeholder="Department *" style="width:100%;padding:12px;border:2px solid #e5e7eb;border-radius:10px;margin:6px 0">
<button id="joinBtn" style="width:100%;padding:14px;background:#0a7e2a;color:#fff;border:none;border-radius:12px;font-weight:900;margin-top:10px;cursor:pointer">JOIN CHAT</button>
</div>
</div>

<div class="header">
<div class="logo" id="headerLogo">FMC</div>
<div style="flex:1"><b>FMC Gusau</b><br><small id="myNameDisplay" style="color:#FFCC00">-</small> <small id="adminBadge" style="background:#FFCC00;color:#000;padding:2px 6px;border-radius:8px;font-size:9px;display:none">ADMIN</small></div>
<button id="settingsBtn" style="background:rgba(255,255,255,.2);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer">⚙️</button>
</div>

<div class="container">
<div id="chatBox"></div>
<div id="uploadProgress" style="background:#fff;padding:6px 12px;font-size:11px;display:none">Uploading... <div class="progress" id="progBar"></div></div>
<div class="input-area">
<button class="icon-btn" id="attachBtn" style="background:#0a7e2a;color:#fff">📎</button>
<button class="icon-btn" id="voiceBtn">🎤</button>
<textarea id="msgInput" placeholder="Type message...
ENTER = new line"></textarea>
<button class="icon-btn btn-send" id="sendBtn">➤</button>
</div>
</div>

<!-- ATTACH PANEL -->
<div id="attachPanel">
<div class="settings-box">
<div style="width:40px;height:4px;background:#ddd;border-radius:10px;margin:0 auto 10px"></div>
<h3 style="color:#0a7e2a">Send Anything</h3>
<div class="attach-grid">
<button class="attach-item" id="btnImage"><span>🖼️</span><b>Image</b></button>
<button class="attach-item" id="btnVideo"><span>🎬</span><b>Video</b></button>
<button class="attach-item" id="btnFile"><span>📁</span><b>File</b></button>
<button class="attach-item" id="btnCamera"><span>📷</span><b>Camera</b></button>
</div>
<input type="file" id="imgInput" accept="image/*" style="display:none">
<input type="file" id="videoInput" accept="video/*" style="display:none">
<input type="file" id="fileInput" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip,.rar" style="display:none">
<button onclick="document.getElementById('attachPanel').style.display='none'" style="width:100%;padding:12px;background:#eee;border:none;border-radius:12px;margin-top:10px">Cancel</button>
</div>
</div>

<!-- SETTINGS -->
<div id="settingsPanel">
<div class="settings-box">
<h3 style="color:#0a7e2a">Settings</h3>
<div id="setInfo" style="background:#f0f7f0;padding:12px;border-radius:12px;margin:10px 0;font-size:12px"></div>
<div class="setting-item"><div><b>Change Name</b></div><button onclick="changeName()" style="padding:8px 14px;background:#0a7e2a;color:#fff;border:none;border-radius:8px">Change</button></div>
<div class="setting-item"><div><b>Logout</b></div><button onclick="logout()" style="padding:8px 14px;background:#c00;color:#fff;border:none;border-radius:8px">Logout</button></div>
<div class="setting-item" id="adminMenu" style="display:none;background:#fff8e1;border-radius:8px;padding:10px"><div><b>Admin - Delete All</b></div><button onclick="clearAll()" style="padding:8px 14px;background:#000;color:#fff;border:none;border-radius:8px">Delete</button></div>
<button onclick="document.getElementById('settingsPanel').style.display='none'" style="width:100%;padding:14px;background:#0a7e2a;color:#fff;border:none;border-radius:12px;margin-top:12px;font-weight:900">Close</button>
<small style="display:block;text-align:center;color:#aaa;font-size:9px;margin-top:8px">Tap FMC logo 5x for Admin</small>
</div>
</div>

<!-- ADMIN -->
<div id="adminPanel" style="align-items:center">
<div class="settings-box" style="max-width:380px;border-radius:20px;border:3px solid #FFCC00">
<h3 style="color:#b77900">🔐 Hidden Admin</h3>
<input id="adminPin" type="password" placeholder="Enter Admin PIN *" style="width:100%;padding:12px;border:2px solid #FFCC00;border-radius:10px;margin:10px 0">
<button id="adminLoginBtn" style="width:100%;padding:12px;background:#000;color:#FFCC00;border:none;border-radius:10px;font-weight:900">UNLOCK</button>
<button onclick="document.getElementById('adminPanel').style.display='none'" style="width:100%;padding:10px;background:#eee;border:none;border-radius:10px;margin-top:8px">Cancel</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJ6iVZ3uCdxtEPO9leU6nX-pURug1wVNw",
  authDomain: "fmc-gusau.firebaseapp.com",
  projectId: "fmc-gusau",
  storageBucket: "fmc-gusau.firebasestorage.app",
  messagingSenderId: "911652359330",
  appId: "1:911652359330:web:506ec4fdb1accc00e75bfb"
};
const SECRET_ADMIN_PIN = "FMC2026"; // <-- CHANGE THIS PIN - ONLY ADMIN KNOWS

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);
const chatCol = collection(db, "messages");

let currentUser = JSON.parse(localStorage.getItem('fmc_user_permanent_v3')||localStorage.getItem('fmc_final_user')||'null');
let isAdmin = localStorage.getItem('fmc_is_admin')==='yes';
const chatBox=document.getElementById('chatBox'); const msgInput=document.getElementById('msgInput');

function updateAdminUI(){ document.getElementById('adminBadge').style.display=isAdmin?'inline-block':'none'; document.getElementById('adminMenu').style.display=isAdmin?'flex':'none'; } updateAdminUI();
if(currentUser){ document.getElementById('loginScreen').style.display='none'; document.getElementById('myNameDisplay').innerText=currentUser.name+' ('+currentUser.dept+')'; document.getElementById('setInfo').innerHTML=`<b>${currentUser.name}</b> (${currentUser.dept})`; }

document.getElementById('joinBtn').onclick=()=>{let n=document.getElementById('userName').value.trim(); let d=document.getElementById('userDept').value.trim(); if(!n||!d){alert('Enter name & dept');return;} currentUser={name:n,dept:d,joined:new Date().toISOString()}; localStorage.setItem('fmc_user_permanent_v3',JSON.stringify(currentUser)); localStorage.setItem('fmc_final_user',JSON.stringify(currentUser)); document.getElementById('loginScreen').style.display='none'; document.getElementById('myNameDisplay').innerText=n+' ('+d+')'; addDoc(chatCol,{name:"System",text:`${n} (${d}) joined`,time:new Date().toLocaleTimeString(),createdAt:serverTimestamp(),system:true}).catch(()=>{}); };
msgInput.addEventListener('input',()=>{msgInput.style.height='auto'; msgInput.style.height=Math.min(msgInput.scrollHeight,100)+'px';});
document.getElementById('sendBtn').onclick=async()=>{let t=msgInput.value.trim(); if(!t||!currentUser)return; msgInput.value=''; msgInput.style.height='44px'; try{await addDoc(chatCol,{name:currentUser.name,dept:currentUser.dept,text:t,type:"text",time:new Date().toLocaleTimeString(),createdAt:serverTimestamp()})}catch(e){alert(e.message)}};

// TAPS FOR ADMIN
let tapCount=0, tapTimer=null; document.getElementById('headerLogo').onclick=()=>{tapCount++; clearTimeout(tapTimer); tapTimer=setTimeout(()=>tapCount=0,2000); if(tapCount>=5){tapCount=0; document.getElementById('adminPanel').style.display='flex';}};
document.getElementById('adminLoginBtn').onclick=()=>{let pin=document.getElementById('adminPin').value.trim(); if(pin===SECRET_ADMIN_PIN){isAdmin=true; localStorage.setItem('fmc_is_admin','yes'); updateAdminUI(); document.getElementById('adminPanel').style.display='none'; alert('Admin unlocked! 🗑️ icons visible');}else{alert('Wrong PIN');}};

document.getElementById('attachBtn').onclick=()=>document.getElementById('attachPanel').style.display='flex';
document.getElementById('attachPanel').onclick=e=>{if(e.target.id==='attachPanel')e.currentTarget.style.display='none'};
document.getElementById('btnImage').onclick=()=>{document.getElementById('attachPanel').style.display='none'; document.getElementById('imgInput').click();};
document.getElementById('btnVideo').onclick=()=>{document.getElementById('attachPanel').style.display='none'; document.getElementById('videoInput').click();};
document.getElementById('btnFile').onclick=()=>{document.getElementById('attachPanel').style.display='none'; document.getElementById('fileInput').click();};
document.getElementById('btnCamera').onclick=()=>{document.getElementById('attachPanel').style.display='none'; document.getElementById('imgInput').setAttribute('capture','environment'); document.getElementById('imgInput').click();};

// UPLOAD FUNCTION WITH PROGRESS
async function uploadFile(file, type){
 const progDiv=document.getElementById('uploadProgress'); const bar=document.getElementById('progBar');
 progDiv.style.display='block'; bar.style.width='10%';
 try{
  const fileName=`${Date.now()}_${file.name}`;
  const storageRef=ref(storage, `chat_files/${fileName}`);
  const uploadTask=uploadBytesResumable(storageRef, file);
  uploadTask.on('state_changed', snap=>{
   let pct=(snap.bytesTransferred/snap.totalBytes)*100;
   bar.style.width=pct+'%';
  });
  await uploadTask;
  const url=await getDownloadURL(storageRef);
  bar.style.width='100%';
  setTimeout(()=>progDiv.style.display='none',800);
  // Save to firestore
  await addDoc(chatCol,{
   name:currentUser.name,dept:currentUser.dept,
   text: type==='video'? '🎬 Video' : type==='image'? '🖼️ Photo' : `📁 ${file.name}`,
   fileUrl:url, fileName:file.name, fileType:file.type, fileSize:file.size,
   type:type, time:new Date().toLocaleTimeString(), createdAt:serverTimestamp()
  });
 }catch(e){
  // Fallback to base64 if storage not enabled
  progDiv.style.display='none';
  if(file.size>800*1024 && type!=='text'){ alert('Storage not enabled or file too big. Enable Firebase Storage Rules: allow read, write: if true; \nTrying base64 fallback for small files...'); }
  if(file.size<900*1024){
   let reader=new FileReader();
   reader.onload=async ev=>{
    try{ await addDoc(chatCol,{name:currentUser.name,dept:currentUser.dept,text: type==='image'?'Photo':file.name, fileUrl:ev.target.result, fileName:file.name, fileType:file.type, fileSize:file.size, type:type, time:new Date().toLocaleTimeString(), createdAt:serverTimestamp()}); }catch(err){alert(err.message)}
   }; reader.readAsDataURL(file);
  }
 }
}

document.getElementById('imgInput').onchange=e=>{let f=e.target.files[0]; if(!f)return; if(f.size>8*1024*1024){alert('Image too large max 8MB');return;} uploadFile(f,'image'); e.target.value=''; e.target.removeAttribute('capture');};
document.getElementById('videoInput').onchange=e=>{let f=e.target.files[0]; if(!f)return; if(f.size>25*1024*1024){alert('Video too large max 25MB');return;} uploadFile(f,'video'); e.target.value='';};
document.getElementById('fileInput').onchange=e=>{let f=e.target.files[0]; if(!f)return; if(f.size>15*1024*1024){alert('File too large max 15MB');return;} uploadFile(f,'file'); e.target.value='';};

// VOICE
let mr=null,ch=[],rec=false;
document.getElementById('voiceBtn').onclick=async()=>{
 let b=document.getElementById('voiceBtn');
 if(!rec){
  try{let s=await navigator.mediaDevices.getUserMedia({audio:true}); mr=new MediaRecorder(s); ch=[]; mr.ondataavailable=e=>ch.push(e.data);
   mr.onstop=async()=>{let blob=new Blob(ch,{type:'audio/webm'}); b.classList.remove('recording'); b.innerText='🎤'; uploadFile(new File([blob], `voice_${Date.now()}.webm`, {type:'audio/webm'}), 'voice');}; mr.start(); rec=true; b.classList.add('recording'); b.innerText='⏹️';
  }catch{alert('Mic permission needed')}
 }else{mr.stop(); rec=false}
};

document.getElementById('settingsBtn').onclick=()=>{document.getElementById('settingsPanel').style.display='flex'; updateAdminUI(); document.getElementById('setInfo').innerHTML=`<b>${currentUser?.name||'-'}</b> (${currentUser?.dept||'-'}) ${isAdmin?'<br><span style="color:green">Admin Active</span>':''}`;};
document.getElementById('settingsPanel').onclick=e=>{if(e.target.id==='settingsPanel')e.currentTarget.style.display='none'};
document.getElementById('adminPanel').onclick=e=>{if(e.target.id==='adminPanel')e.currentTarget.style.display='none'};
window.changeName=()=>{let n=prompt('New Name:',currentUser.name); if(!n)return; let d=prompt('New Dept:',currentUser.dept); if(!d)return; currentUser.name=n.trim(); currentUser.dept=d.trim(); localStorage.setItem('fmc_user_permanent_v3',JSON.stringify(currentUser)); document.getElementById('myNameDisplay').innerText=currentUser.name+' ('+currentUser.dept+')';};
window.logout=()=>{if(confirm('Logout?')){localStorage.removeItem('fmc_user_permanent_v3'); localStorage.removeItem('fmc_final_user'); localStorage.removeItem('fmc_is_admin'); location.reload();}};
window.clearAll=async()=>{if(!isAdmin){alert('Admin only');return;} if(!confirm('Delete ALL?'))return; const snap=await getDocs(chatCol); for(const d of snap.docs){await deleteDoc(doc(db,"messages",d.id));}};
window.deleteMsg=async(id)=>{if(!isAdmin)return; if(!confirm('Delete this message?'))return; await deleteDoc(doc(db,"messages",id));};

const q=query(chatCol, orderBy("createdAt","desc"), limit(50));
onSnapshot(q, snap=>{
 let arr=[]; snap.forEach(d=>arr.push({id:d.id,...d.data()})); arr.reverse();
 chatBox.innerHTML='';
 arr.forEach(m=>{
  if(!m.name)return;
  if(m.system){chatBox.innerHTML+=`<div style="align-self:center;background:#fff8c6;padding:6px 12px;border-radius:20px;font-size:10px;color:#665;margin:4px 0">${m.text}</div>`; return;}
  let badge=`<div class="msg-head"><div class="msg-avatar">${m.name.charAt(0).toUpperCase()}</div><div><div class="msg-name">${m.name} (${m.dept||'FMC'})</div><div class="msg-meta">${m.time||''}</div></div></div>`;
  let body=`<div class="msg-text">${m.text}</div>`;
  if(m.type==='image' && m.fileUrl) body+=`<img src="${m.fileUrl}" style="max-width:100%;border-radius:10px;margin-top:6px;margin-left:32px" loading="lazy" />`;
  if(m.type==='video' && m.fileUrl) body+=`<video src="${m.fileUrl}" controls style="max-width:260px"></video>`;
  if(m.type==='voice' && m.fileUrl) body+=`<audio src="${m.fileUrl}" controls></audio>`;
  if(m.type==='file' && m.fileUrl) body+=`<div class="file-card"><div style="font-size:26px">📄</div><div style="flex:1"><div style="font-weight:900;font-size:12px">${m.fileName||'File'}</div><div style="font-size:10px;color:#666">${(m.fileSize/1024).toFixed(1)} KB • ${m.fileType||''}</div></div><a href="${m.fileUrl}" target="_blank" download="${m.fileName}" style="background:#0a7e2a;color:#fff;padding:6px 10px;border-radius:8px;text-decoration:none;font-size:11px">Open</a></div>`;
  let isMe=currentUser && m.name==currentUser.name &&!m.system;
  chatBox.innerHTML+=`<div class="msg ${isMe?'me':'other'} ${isAdmin?'admin':''}">${badge}${body}<button class="msg-del" onclick="deleteMsg('${m.id}')">🗑️</button></div>`;
 });
 chatBox.scrollTop=chatBox.scrollHeight;
});
</script>
</body>
</html>
